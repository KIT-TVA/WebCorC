parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      format: uuid
    description: The job id, as given when the job was started.

get:
  summary: Fetch the job's result
  operationId: readJobResult
  description: >-
    Called once this Verifier's own done message has arrived on the status
    stream. Returns this Verifier's actual per-statement results as a flat
    map keyed by statement id — never a tree, so this Verifier never has to
    reconstruct or preserve the shape it was given the ids in.
  tags:
    - Verifier
  responses:
    '200':
      description: This Verifier's per-statement results
      content:
        application/json:
          schema:
            $ref: '../../schema/verifiers/job/result.yml'
    '404':
      description: Job by id not found
      content:
        application/problem+json:
          schema:
            $ref: '../../schema/problem.yml'
    '500':
      description: Generic Server Error
      content:
        application/problem+json:
          schema:
            $ref: '../../schema/problem.yml'
    '503':
      description: Service Unavailable
      content:
        application/problem+json:
          schema:
            $ref: '../../schema/problem.yml'
