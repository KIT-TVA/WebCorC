parameters:
  - in: path
    required: true
    name: id
    schema:
      type: string
      format: uuid

get:
  summary: Fetch a verification job's result
  operationId: readJobResultByUUID
  description: >-
    The job's formula with every result merged in: the Functional Verifier's
    own `isProven`, and each statement's `verifiers` entries carrying
    the `proven`/`status` each Verifier reported for it. Available once the
    job's status stream (`/ws/verify/{id}`) has sent its complete message;
    until then — or once the job has been forgotten — the request fails.
  tags:
    - Editor
  responses:
    '200':
      description: The finished job's formula
      content:
        application/json:
          schema:
            $ref: '../../schema/cbc/formula.yml'
    '500':
      description: Job not found, or not finished yet
      content:
        application/problem+json:
          schema:
            $ref: '../../schema/problem.yml'
    '503':
      description: Service Unavailable
      content:
        application/problem+json:
          schema:
            $ref: '../../schema/problem.yml'
