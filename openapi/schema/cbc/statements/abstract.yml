type: object
description: >-
  Shared fields of every statement kind. `preCondition`/`postCondition` are
  the Functional Verifier's; every other Verifier's conditions live in
  `verifiers`.
properties:
  name:
    type: string

  type:
    type: string
    enum:
      - STATEMENT
      - SKIP
      - COMPOSITION
      - SELECTION
      - REPETITION
      - RETURN

  preCondition:
    $ref: '../condition.yml'

  postCondition:
    $ref: '../condition.yml'

  verifiers:
    $ref: '../verifiers.yml'

  isProven:
    type: boolean
    description: The Functional Verifier's verdict for this statement.

required:
  - type
  - preCondition
  - postCondition
  - isProven
