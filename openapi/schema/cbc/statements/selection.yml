description: >-
  A selection statement: `commands[i]` runs when `guards[i]` holds, in order.
allOf:
  - $ref: './abstract.yml'
  - type: object
    properties:
      type:
        type: string
        enum:
          - SELECTION

      guards:
        type: array
        items:
          $ref: '../condition.yml'

      commands:
        type: array
        items:
          $ref: '../statement.yml'

      preProven:
        type: boolean
        description: >-
          Whether the precondition implying one of the guards is already
          proven.
