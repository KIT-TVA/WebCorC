description: >-
  A repetition statement, `while (guard) loopStatement`. `variantProven`,
  `preProven` and `postProven` record which of its own proof obligations are
  already proven.
allOf:
  - $ref: './abstract.yml'
  - type: object
    properties:
      type:
        type: string
        enum:
          - REPETITION

      guard:
        $ref: '../condition.yml'

      invariant:
        $ref: '../condition.yml'

      variant:
        $ref: '../condition.yml'

      loopStatement:
        $ref: '../statement.yml'

      variantProven:
        type: boolean

      preProven:
        type: boolean

      postProven:
        type: boolean

    required:
      - guard
      - invariant
      - variant
