type: object
description: >-
  Request body for starting a verification job. Everything this Verifier
  needs to perform static analysis on the program: the program's code-level
  representation with this Verifier's own conditions already in place, the
  project's source, and this Verifier's resolved Settings.
properties:
  program:
    $ref: './program.yml'

  files:
    type: array
    description: >-
      The project's existing source and include files, unconditionally
      attached.
    items:
      $ref: './sourceFile.yml'

  settings:
    $ref: './settingsValues.yml'

required:
  - program
  - files
  - settings
