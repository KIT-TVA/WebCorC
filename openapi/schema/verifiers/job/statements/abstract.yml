type: object
description: >-
  Shared fields of every statement kind in the program a Verifier receives —
  WebCorC's own statement shape narrowed to code-level input.
  `preCondition`/`postCondition` carry this
  Verifier's own Verifier Condition — not the statement's functional
  pre/postcondition, which is not sent — never a sparse per-Verifier map, and
  are both absent where the user has not written one for this statement and
  Verifier.
properties:
  id:
    type: integer
    format: int64
    description: >-
      Stable id of the statement, unique within this program. Echoed back as
      a key of the flat map returned by the result fetch, so this Verifier
      can key its own results the same way without minting its own ids.

  name:
    type: string

  type:
    type: string
    enum:
      - STATEMENT
      - SKIP
      - COMPOSITION
      - SELECTION
      - REPETITION

  preCondition:
    $ref: '../condition.yml'

  postCondition:
    $ref: '../condition.yml'

required:
  - id
  - name
  - type
