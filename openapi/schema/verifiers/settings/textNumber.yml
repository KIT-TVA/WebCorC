type: object
description: >-
  VerifierTextNumberSetting — a numeric text setting. A closed object: it accepts exactly the
  properties listed here and nothing else. `id`, `label` and `description` are common to every
  setting kind; `required` and `default` are the string value carrier shared with the
  text/string and select settings — a numeric setting still stores its value as a canonical
  `.`-separated decimal string, so an invalid value survives to be flagged rather than silently
  swallowed. `step` and `range` exist on this kind only.
properties:
  id:
    type: string
    description: Stable key of the setting, used to address it when persisting changes.

  label:
    type: string
    description: Human-readable label rendered next to the input.

  description:
    type: string
    description: Optional longer description of what the setting controls.

  type:
    type: string
    enum:
      - text

  valueType:
    type: string
    enum:
      - number

  required:
    type: boolean
    description: >-
      Whether the setting must be filled in. When `true`, a non-empty `default` must be
      provided.

  default:
    type: string
    description: >-
      Value used to preinitialize the setting, as a canonical `.`-separated decimal string in
      the strict grammar `-?\d+(\.\d+)?` (no whitespace, exponent, leading `+`, or leading or
      trailing `.`), within `range` and on the `step` grid. `""` means no default, which does
      not satisfy `required: true`. Mandatory when `required` is `true`, optional otherwise.

  step:
    type: number
    description: >-
      Precision grid for the value, greater than `0`. An omitted step means `1` (integers
      only). The grid is measured relative to `range.min` (or `0` when no min is given),
      matching native input[type=number] semantics.

  range:
    type: object
    description: >-
      Inclusive bounds for the value; each bound is optional, and `min` is below `max` when
      both are given. A closed object.
    properties:
      min:
        type: number
        description: Inclusive lower bound.

      max:
        type: number
        description: Inclusive upper bound.

    additionalProperties: false

required:
  - id
  - label
  - type
  - valueType
additionalProperties: false
