type: object
description: >-
  VerifierSelectSetting — a setting rendered as a dropdown of predefined options. A closed
  object: it accepts exactly the properties listed here and nothing else. `id`, `label` and
  `description` are common to every setting kind; `required` and `default` are the string
  value carrier shared with the text settings, holding the chosen option's `id`.
properties:
  id:
    type: string
    description: Stable key of the setting, used to address it when persisting changes.

  label:
    type: string
    description: Human-readable label rendered next to the input.

  description:
    type: string
    description: Optional longer description of what the setting controls.

  type:
    type: string
    enum:
      - select

  options:
    type: array
    description: Predefined options rendered in the dropdown; no two share an `id`.
    items:
      type: object
      description: One option; a closed object.
      properties:
        id:
          type: string
          description: Stable id of the option, persisted when the option is chosen.

        label:
          type: string
          description: Human-readable label rendered for the option.

      required:
        - id
        - label
      additionalProperties: false

  required:
    type: boolean
    description: >-
      Whether the setting must be filled in. When `true`, a non-empty `default` must be
      provided.

  default:
    type: string
    description: >-
      Id of the option used to preselect the dropdown; must be one of the `options`' ids.
      `""` means no default, which does not satisfy `required: true`. Mandatory when
      `required` is `true`, optional otherwise. On an optional select, the user can clear the
      dropdown back to `""` even when a default is set; that sends `""`, not the default.

required:
  - id
  - label
  - type
  - options
additionalProperties: false
