micronaut:
  application.name: webcorc-backend
  http:
    client:
      read-timeout: 180s
      connect-timeout: 30s
  object-storage:
    aws:
      default:
        bucket: webcorc-projectfiles
  router:
    static-resources:
      swagger:
        paths: 'classpath:META-INF/swagger'
        mapping: '/swagger/**'
      swagger-ui:
        paths: 'classpath:META-INF/swagger/views/swagger-ui'
        mapping: '/swagger-ui/**'
  server:
    multipart:
      enabled: true
      max-file-size: 1000000

    cors:
      enabled: true
      localhost-pass-through: true
      configurations:
        frontend:
          - '"${FRONTEND_URL:webcorc.informatik.kit.edu}"'

  http.client.max-content-length: 1000000

mongodb:
  uri: '${MONGODB_URI}'

aws:
  accessKeyId: '${RUSTFS_ACCESS_KEY:root}'
  secretKey: '${RUSTFS_SECRET_KEY:changeme}'
  region: 'eu-west-1'
  s3:
    enabled: true
    path-style-access-enabled: true
  services.s3.endpoint-override: "${MICRONAUT_RUSTFS_ADDRESS:`http://localhost:9000`}"

openai.accessToken: '${OPENAI_ACCESS_TOKEN:changeme}'
anthropic.accessToken: '${ANTHROPIC_ACCESS_TOKEN:changeme}'
xai.accessToken: '${XAI_ACCESS_TOKEN:changeme}'
google.accessToken: '${GOOGLE_ACCESS_TOKEN:changeme}'

development: '${DEVELOPMENT:false}'

# Verifier Registry: the Verifiers this deployment provides, in presentation order.
# Empty by default; a deployment mounts its own list via MICRONAUT_CONFIG_FILES.
verifiers: []

# Startup fetch of the Verifiers' Self-Descriptions: an unreachable Verifier is asked again
# `retries` times, `retry-delay` apart, before it is locked off in the Verifier Catalog until
# the next restart. An invalid Self-Description is never retried. Each attempt uses the
# `micronaut.http.client` timeouts above. The fetch runs beside the startup, not in it: the
# HTTP server is up meanwhile and a request for the Catalog is held until the fetch is done.
# Override any of these in the same file as the Registry.
verifier-catalog:
  retries: 3
  retry-delay: 10s
  
rate-limit:
  enabled: true
  requests-per-minute: 10
  requests-per-hour: 50
  trust-forwarded-headers: true
