<app-statement-base
  icon="pi pi-link"
  [_node]="_node"
  [refinement]="this"
  [hideSourceHandle]="true"
  [hasVerifierMiddle]="true"
  middleLabel="Intermediate"
>
  <ng-template #middleContent let-popup="popup" let-verifier="verifier">
    @if (!popup) {
      <div class="w-fit">
        @if (!_node.firstStatementNode) {
          <app-refinement-widget
            text="Left"
            icon="add"
            (select)="chooseRefinement('left', $event)"
            >
          </app-refinement-widget>
        }
        <handle type="source" position="bottom" id="0" [offsetX]="-200"/>
      </div>
    }
    <div class="relative flex items-center h-full"
         [class.w-56]="!popup"
         [class.w-full]="popup"
         [class.popup-fill-target]="popup">
      <app-condition-editor
        [condition]="intermediateConditionFor(verifier)"
        placeholder="Intermediate"
        [fill]="popup"
        (textChanged)="onEditableContentChanged()"
      ></app-condition-editor>
    </div>
    @if (!popup) {
      <div class="w-fit">
        @if (!_node.secondStatementNode) {
          <app-refinement-widget
            text="Right"
            icon="add"
            (select)="chooseRefinement('right', $event)"
            >
          </app-refinement-widget>
        }
        <handle type="source" position="bottom" id="1" [offsetX]="-300" />
      </div>
    }
  </ng-template>
</app-statement-base>
