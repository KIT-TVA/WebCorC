<div class="condition-editor-root" (mousedown)="$event.stopImmediatePropagation()">
    <div (focusout)="conditionEditingFinished.emit()">
        <form>
            <p-float-label variant="on" class="flex flex-row">
          <textarea
                  [ngModelOptions]="{ standalone: true }"
                  id="field"
                  pTextarea
                  class="textarea condition-textarea"
                  spellcheck="false"
                  [rows]="inline ? 1 : 5"
                  [ngModel]="(condition | async)?.condition"
                  (ngModelChange)="onConditionChange($event)"
                  variant="filled"
                  [disabled]="!editable"
                  [dt]="{
              root: {
                borderColor: redConditions.includes((condition | async)!)
                  ? '#ff7e7e'
                  : greenConditions.includes((condition | async)!)
                    ? '#6ab77a'
                    : $dt('textarea.border.color').value,
              },
            }"
          >
          </textarea>
                <label for="field">{{ placeholder }}</label>
                <div class="condition-button-stack">
                    <p-button
                            (click)="onAiButtonClick()"
                            icon="pi pi-sparkles"
                            variant="text"
                            severity="secondary"

                    >
                    </p-button>
                    <p-button
                            (click)="onEditConditionClick()"
                            icon="pi pi-pencil"
                            variant="text"
                            severity="secondary"
                    >
                    </p-button>
                </div>
            </p-float-label>

        </form>
    </div>
    <p-dialog
            [(visible)]="isDialogVisible"
            [modal]="false"
            appendTo="body"
            [header]="placeholder"
            [style]="{ width: '40vw', height:'50vh'}"
            [contentStyle]="{ overflow: 'hidden'}"
            closable="false"
    >
        <div class="flex flex-col">
            <textarea
                    [ngModelOptions]="{ standalone: true }"
                    id="field"
                    pTextarea
                    class="condition-textarea-dialog"
                    spellcheck="false"
                    [rows]="inline ? 1 : 10"
                    [ngModel]="(condition | async)?.condition"
                    (ngModelChange)="onConditionChange($event)"
                    variant="filled"
                    [disabled]="!editable"
                    [dt]="{
              root: {
                borderColor: redConditions.includes((condition | async)!)
                  ? '#ff7e7e'
                  : greenConditions.includes((condition | async)!)
                    ? '#6ab77a'
                    : $dt('textarea.border.color').value,
              },
            }"
            >
          </textarea>
            <div class="flex flex-row justify-end gap-1 pt-1">
                <p-button
                    severity="secondary"
                >
                    Discard
                </p-button>
                <p-button>
                    Save
                </p-button>
            </div>
        </div>
    </p-dialog>
</div>
