<div class="condition-editor-root" (mousedown)="$event.stopImmediatePropagation()">
    <div (focusout)="conditionEditingFinished.emit()">
        <form>
            <p-float-label variant="on" class="flex flex-row">
          <textarea
                  [ngModelOptions]="{ standalone: true }"
                  id="field"
                  pTextarea
                  class="textarea condition-textarea"
                  spellcheck="false"
                  [rows]="inline ? 1 : 5"
                  [ngModel]="(condition | async)?.condition"
                  (ngModelChange)="onConditionChange($event)"
                  variant="filled"
                  [disabled]="!editable"
                  [dt]="{
              root: {
                borderColor: redConditions.includes((condition | async)!)
                  ? '#ff7e7e'
                  : greenConditions.includes((condition | async)!)
                    ? '#6ab77a'
                    : $dt('textarea.border.color').value,
              },
            }"
          >
          </textarea>
                <label for="field">{{ placeholder }}</label>
                <div class="condition-button-stack" [class.condition-button-stack--with-ai]="showAiButton">
                    <p-button
                            (click)="onEditConditionClick()"
                            icon="pi pi-pencil"
                            variant="text"
                            severity="secondary"
                            [disabled]="!editable"
                    >
                    </p-button>
                    @if (showAiButton) {
                        <p-button
                                (click)="synthesizeWithAi()"
                                icon="pi pi-microchip-ai"
                                variant="text"
                                severity="secondary"
                                title="Synthesize statement with AI"
                        >
                        </p-button>
                    }
                    <p-button
                            (click)="onAiButtonClick()"
                            icon="pi pi-sparkles"
                            variant="text"
                            severity="secondary"
                    >
                    </p-button>
                </div>
            </p-float-label>

        </form>
    </div>
    <p-dialog
            [(visible)]="isDialogVisible"
            [modal]="true"
            appendTo="body"
            [header]="placeholder"
            [style]="{ width: '40vw', height:'50vh'}"
            [contentStyle]="{ overflow: 'hidden'}"
            closable="true"
            [closeOnEscape]="true"
            (onHide)="onDialogSaveClick()"
    >
        <div class="flex flex-col h-full">
            <textarea
                    [ngModelOptions]="{ standalone: true }"
                    id="field"
                    pTextarea
                    class="condition-textarea-dialog"
                    spellcheck="false"
                    [ngModel]="dialogConditionText"
                    (ngModelChange)="dialogConditionText = $event"
                    variant="filled"
            >
          </textarea>
            <div class="condition-dialog-buttons">
                <p-button
                    severity="secondary"
                    (click)="onDialogDiscardClick()"
                >
                    Discard
                </p-button>
                <p-button
                    (click)="onDialogSaveClick()"
                >
                    Save
                </p-button>
            </div>
        </div>
    </p-dialog>
</div>
