<div class="drawer-content">
  <p-menubar
    class="rounded-none border-0 z-10 project-actions"
    [model]="menuItems"
  >
  </p-menubar>
  <p-tree
    [value]="treeNodes"
    [draggableNodes]="true"
    [droppableNodes]="true"
    draggableScope="self"
    droppableScope="self"
    (onNodeExpand)="setExpanded($event.node)"
    (onNodeCollapse)="setCollapsed($event)"
    (onNodeDrop)="dropNode($event)"
    (click)="onTreeClick($event)"
    emptyMessage='Add a file by clicking "New"'
  >
    <ng-template #header>
      <div class="project-header" [title]="projectService.projectName || 'Untitled project'">
        <span class="project-header-name">
          {{ projectService.projectName || "Untitled project" }}
        </span>
      </div>
    </ng-template>
     <ng-template
        let-node
        pTemplate="directory"
        class="w-full box-content"
      >
        <div
          class="w-full flex items-center justify-between"
          [class.explorer-active]="node.key === activeKey"
        >
          <span
            class="flex items-center gap-2 min-w-0 select-none"
          >
            <i [class]="node.icon + ' explorer-node-icon shrink-0'"></i>
            <span class="truncate">{{ node.label }}</span>
            @if (isInRubbishBin(node.data)) {
              <p-tag
                severity="secondary"
                icon="pi pi-info-circle"
                value="read only"
                class="whitespace-nowrap"
              />
            }
          </span>

          <span class="self-end shrink-0">
            <!-- always rendered so every row has the same height; only visible on the highlighted row -->
            <p-button
              icon="pi pi-ellipsis-v"
              text
              severity="contrast"
              ariaLabel="More actions"
              [class.invisible]="node.key !== activeKey"
              (click)="openDotMenu($event, node, nodeMenu)"
            ></p-button>
          </span>
        </div>
      </ng-template>
<ng-template
      let-node
      pTemplate="fake"
      class="w-full box-content"
    >
      <div
        class="w-full flex items-center justify-between"
      >
        <span>
          <p-float-label variant="on">
            <p-icon-field>
              <input pInputText #newElement class="w-full" />
              <label for="newElement">New Element</label>
              <p-inputicon
                class="pi pi-times text-danger"
                (click)="deleteElement(node.data)"
              >
              </p-inputicon>
            </p-icon-field>
          </p-float-label>
        </span>
        <span class="self-end">
          <p-button
            icon="pi pi-sitemap"
            text
            pTooltip="Diagram file"
            severity="contrast"
            (click)="addFile(node.data, newElement.value, 'diagram')"
          >
          </p-button>
          <p-button
            text
            severity="contrast"
            icon="pi pi-code"
            pTooltip="Java file"
            (click)="addFile(node.data, newElement.value, 'java')"
          >
          </p-button>
          <p-button
            text
            severity="contrast"
            icon="pi pi-key"
            pTooltip="Key file"
            (click)="addFile(node.data, newElement.value, 'key')"
          >
          </p-button>
          <p-button
            icon="pi pi-folder"
            pTooltip="Directory"
            (click)="addFolder(node.data, newElement.value)"
            severity="contrast"
            text
          >
          </p-button>
        </span>
      </div>
    </ng-template>
    <ng-template
      let-node
      pTemplate="rename"
      class="w-full box-content"
    >
      <div
        class="w-full flex items-center justify-between"
      >
        <span>
          <p-float-label variant="on">
            <p-icon-field>
              <input pInputText #renameInput class="w-full" />
              <label for="renameInput">Rename Element</label>
              <p-inputicon
                class="pi pi-check text-success"
                (click)="renameElement(node.data, renameInput.value)"
              >
              </p-inputicon>
            </p-icon-field>
          </p-float-label>
        </span>
      </div>
    </ng-template>
     <ng-template
       let-node
       pTemplate="file"
       class="w-full box-content"
     >
       <div
         class="w-full flex items-center justify-between"
         [class.explorer-active]="node.key === activeKey"
       >
         <span class="flex items-center gap-2 w-full min-w-0">
           <span class="truncate select-none">{{ node.label }}</span>
           @if ((node.data.urn) === "include/generatedPredicates.key") {
             <p-tag
               severity="secondary"
               icon="pi pi-info-circle"
               value="read only"
               class="whitespace-nowrap"
             />
           }
           @if (isInRubbishBin(node.data)) {
             <p-tag
               severity="secondary"
               icon="pi pi-info-circle"
               value="read only"
               class="whitespace-nowrap"
             />
           }
         </span>
          <span class="self-end file-actions shrink-0">
            <!-- always rendered so every row has the same height; only visible on the highlighted row -->
            <p-button
              icon="pi pi-ellipsis-v"
              text
              severity="contrast"
              ariaLabel="More actions"
              [class.invisible]="node.key !== activeKey"
              (click)="openDotMenu($event, node, nodeMenu)"
            ></p-button>
          </span>
       </div>
     </ng-template>
</p-tree>
  <!-- One shared popup menu; openDotMenu() fills it with the clicked node's actions -->
  <p-tieredmenu #nodeMenu [model]="nodeMenuItems" [popup]="true" appendTo="body" />
</div>
