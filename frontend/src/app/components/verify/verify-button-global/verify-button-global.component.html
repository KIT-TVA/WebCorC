@if (showModeDropdown()) {
<p-splitbutton
    [model]="verifyOptions()"
    [disabled]="isDisabled || isVerifying"
    [icon]="isVerifying ? 'pi pi-spin pi-spinner' : 'pi pi-check-circle'"
    [label]="verifyButtonLabel()"
    (onClick)="verify()"
    class="verify-splitbutton"/>
} @else {
<p-button
    [disabled]="isDisabled || isVerifying"
    [icon]="isVerifying ? 'pi pi-spin pi-spinner' : 'pi pi-check-circle'"
    label="Verify"
    (onClick)="verify()"
    class="verify-plain-button"/>
}
